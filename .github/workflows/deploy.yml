name: Deploy to EC2

on:
  push:
    branches:
      - 44-cicd

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create .env file
        run: |
          touch .env
          echo "POSTGRES_DB_NAME=${{ secrets.POSTGRES_DB_NAME }}" >> .env
          echo "POSTGRES_DB_USER=${{ secrets.POSTGRES_DB_USER }}" >> .env
          echo "POSTGRES_DB_PASSWORD=${{ secrets.POSTGRES_DB_PASSWORD }}" >> .env
          echo "POSTGRES_DB_HOST=${{ secrets.POSTGRES_DB_HOST }}" >> .env
          echo "POSTGRES_DB_PORT=${{ secrets.POSTGRES_DB_PORT }}" >> .env

      - name: Deploy to EC2 Frontend
        run: |
          scp -o StrictHostKeyChecking=no -r client ec2-user@${{ secrets.EC2_FRONTEND_IP }}:/home/ec2-user
          scp -o StrictHostKeyChecking=no compose.yaml ec2-user@${{ secrets.EC2_FRONTEND_IP }}:/home/ec2-user
          scp -o StrictHostKeyChecking=no .env ec2-user@${{ secrets.EC2_FRONTEND_IP }}:/home/ec2-user
          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_FRONTEND_IP }} << 'EOF'
            docker-compose down
            docker-compose up -d client
          EOF

