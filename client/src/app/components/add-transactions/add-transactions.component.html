<div
  class="rental-container flex flex-col gap-6 h-full"
  *ngIf="vehicleInformations?.type === vehicleType.Rental; else venteTemplate">
  <div class="form-section flex-grow">
    <form class="flex flex-col gap-4">
      <div class="field flex gap-4 items-center">
        <label for="type" class="w-1/3">Type de demande</label>
        <p-tag [value]="vehicleInformations.type" severity="info"></p-tag>
      </div>

      <div class="field flex gap-4 items-center">
        <label for="startDate" class="w-1/3">Date de début</label>
        <p-datepicker
          id="startDate"
          [(ngModel)]="startDate"
          name="startDate"
          [showIcon]="true"
          dateFormat="yy.mm.dd"
          class="w-full"
          (ngModelChange)="onDateChange()" />
      </div>

      <div class="field flex gap-4 items-center">
        <label for="endDate" class="w-1/3">Date de fin</label>
        <p-datepicker
          id="endDate"
          [(ngModel)]="endDate"
          name="endDate"
          [showIcon]="true"
          dateFormat="yy.mm.dd"
          class="w-full"
          (ngModelChange)="onDateChange()" />
      </div>

      <div *ngIf="errorMessage" class="p-error mt-2">{{ errorMessage }}</div>
    </form>
  </div>

  <div class="button-section flex justify-end gap-2 mt-auto">
    <p-button
      label="Annuler"
      severity="secondary"
      (click)="ref.close()"
      class="mr-2" />
    <p-button
      label="Valider"
      severity="primary"
      (click)="submitTransaction()"
      [disabled]="isSubmitDisabled" />
  </div>
</div>

<ng-template #venteTemplate>
  <div class="flex flex-col gap-6 h-full">
    <div class="sale-section">
      <div class="field flex gap-4 items-center mb-8">
        <label class="w-1/3">Type de demande</label>
        <p-tag value="Vente" severity="secondary"></p-tag>
      </div>

      <div class="field flex items-start gap-2">
        <p-checkbox
          id="dossierRequest"
          [(ngModel)]="dossierRequested"
          binary="true"></p-checkbox>
        <label for="dossierRequest" class="cursor-pointer">
          Je souhaite demander un dossier pour l'achat de ce véhicule.
        </label>
      </div>
    </div>

    <div class="button-section flex justify-end gap-2 mt-auto">
      <p-button
        label="Annuler"
        severity="secondary"
        (click)="ref.close()"
        class="mr-2" />

      <p-button
        label="Valider"
        severity="primary"
        (click)="submitTransaction()"
        [disabled]="!dossierRequested" />
    </div>
  </div>
</ng-template>
