<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-2">
  <label class="flex flex-col gap-4">
    Modèle :
    <input
      type="text"
      formControlName="model"
      required
      class="bg-white border-white border-solid w-92 h-10 rounded-sm text-black p-2" />
    <div
      *ngIf="form.controls['model'].invalid && form.controls['model'].touched"
      class="error">
      Le modèle est requis.
    </div>
  </label>

  <label class="flex flex-col gap-4">
    Année :
    <input
      type="number"
      formControlName="year"
      min="1908"
      max="2025"
      required
      class="bg-white border-white border-solid w-92 h-10 rounded-sm text-black p-2" />
    <div
      *ngIf="form.controls['year'].invalid && form.controls['year'].touched"
      class="error">
      L'année doit être comprise entre 1908 et 2025.
    </div>
  </label>

  <label class="flex flex-col gap-4">
    Km :
    <input
      type="number"
      formControlName="km"
      required
      class="bg-white border-white border-solid w-92 h-10 rounded-sm text-black p-2" />
    <div
      *ngIf="form.controls['km'].invalid && form.controls['km'].touched"
      class="error">
      Le kilométrage est requis.
    </div>
  </label>

  <label class="flex flex-col gap-4">
    Vente/Location :
    <p-select
      formControlName="type"
      [options]="vehicleType"
      optionLabel="name"
      placeholder="Choisissez un type de vente."
      class="w-full md:w-56 user-select-text-black"></p-select>
    <div
      *ngIf="form.controls['type'].invalid && form.controls['type'].touched"
      class="error">
      Veuillez sélectionner un type de vente.
    </div>
  </label>

  <label class="flex flex-col gap-4">
    Prix :
    <input
      type="number"
      formControlName="price"
      required
      class="bg-white border-white border-solid w-92 h-10 rounded-sm text-black p-2" />
    <div
      *ngIf="form.controls['price'].invalid && form.controls['price'].touched"
      class="error">
      Le prix est requis.
    </div>
  </label>

  <label class="flex flex-col gap-4">
    Marque :
    <p-select
      formControlName="brand"
      [options]="vehicleBrand"
      optionLabel="name"
      placeholder="Choisissez une marque de véhicule"
      class="w-full md:w-56"></p-select>
    <div
      *ngIf="form.controls['brand'].invalid && form.controls['brand'].touched"
      class="error">
      Veuillez sélectionner une marque.
    </div>
  </label>

  <label class="flex flex-col gap-4">
    Type de carburant :
    <p-select
      formControlName="energy"
      [options]="vehicleEnergy"
      optionLabel="name"
      placeholder="Choisissez le carburant utilisé."
      class="w-full md:w-56"></p-select>
    <div
      *ngIf="form.controls['energy'].invalid && form.controls['energy'].touched"
      class="error">
      Veuillez sélectionner un type de carburant.
    </div>
  </label>

  <label class="flex flex-col gap-2">
    Type de Véhicule:
    <p-select
      formControlName="category"
      [options]="vehicleCategory"
      optionLabel="name"
      placeholder="Choisissez le type du véhicule."
      class="w-full md:w-56"></p-select>
    <div
      *ngIf="
        form.controls['category'].invalid && form.controls['category'].touched
      "
      class="error">
      Veuillez sélectionner un type de véhicule.
    </div>
  </label>

  <label class="flex flex-col gap-2">
    Description:
    <textarea
      rows="5"
      cols="30"
      pTextarea
      formControlName="description"
      maxlength="255"
      required
      class="resize-none"></textarea>
    <div
      *ngIf="
        form.controls['description'].invalid &&
        form.controls['description'].touched
      "
      class="error">
      La description est requise.
    </div>
  </label>

  <div class="card">
    <p-toast />
    <p-fileupload
      name="vehicle-pictures"
      [multiple]="true"
      accept="image/*"
      maxFileSize="maxFileSize"
      (onUpload)="onTemplatedUpload()"
      (onSelect)="onSelectedFiles($event)">
      <ng-template
        #header
        let-files
        let-chooseCallback="chooseCallback"
        let-clearCallback="clearCallback"
        let-uploadCallback="uploadCallback">
        <div class="flex flex-wrap justify-between items-center flex-1 gap-4">
          <div class="flex gap-2">
            <p-button
              (onClick)="choose(chooseCallback)"
              icon="pi pi-images"
              [rounded]="true"
              [outlined]="true" />
            <p-button
              (onClick)="onClearAllUpload(clearCallback)"
              icon="pi pi-times"
              [rounded]="true"
              [outlined]="true"
              severity="danger"
              [disabled]="!files || files.length === 0" />
          </div>
          <p-progressbar
            [value]="totalSizePercent"
            [showValue]="false"
            class="w-full"
            styleClass="md:w-20rem h-1 w-full md:ml-auto">
            <span class="whitespace-nowrap">{{ maxFileSize / 1000000 }}Mb</span>
          </p-progressbar>
        </div>
      </ng-template>
      <ng-template
        #content
        let-files
        let-uploadedFiles="uploadedFiles"
        let-removeFileCallback="removeFileCallback"
        let-removeUploadedFileCallback="removeUploadedFileCallback">
        <div class="flex flex-col gap-8 pt-4">
          <div *ngIf="files?.length > 0">
            <h5>Pending</h5>
            <div class="flex flex-wrap gap-4">
              <div
                *ngFor="let file of files; let i = index"
                class="p-8 rounded-border flex flex-col border border-surface items-center gap-4">
                <div>
                  <img
                    role="presentation"
                    [alt]="file.name"
                    [src]="file.objectURL"
                    width="100"
                    height="50" />
                </div>
                <span
                  class="font-semibold text-ellipsis max-w-60 whitespace-nowrap overflow-hidden">
                  {{ file.name }}
                </span>
                <div>{{ formatSize(file.size) }}</div>
                <p-badge value="Pending" severity="warn" />
                <p-button
                  icon="pi pi-times"
                  (click)="
                    onRemoveTemplatingFile($event, removeFileCallback, index)
                  "
                  [outlined]="true"
                  [rounded]="true"
                  severity="danger" />
              </div>
            </div>
          </div>
          <div *ngIf="uploadedFiles?.length > 0">
            <h5>Completed</h5>
            <div class="flex flex-wrap gap-4">
              <div
                *ngFor="let file of uploadedFiles; let i = index"
                class="card m-0 px-12 flex flex-col border border-surface items-center gap-4">
                <div>
                  <img
                    role="presentation"
                    [alt]="file.name"
                    [src]="file.objectURL"
                    width="100"
                    height="50" />
                </div>
                <span
                  class="font-semibold text-ellipsis max-w-60 whitespace-nowrap overflow-hidden">
                  {{ file.name }}
                </span>
                <div>{{ formatSize(file.size) }}</div>
                <p-badge value="Completed" class="mt-4" severity="success" />
                <p-button
                  icon="pi pi-times"
                  (onClick)="removeUploadedFileCallback(index)"
                  [outlined]="true"
                  [rounded]="true"
                  severity="danger" />
              </div>
            </div>
          </div>
        </div>
      </ng-template>
      <ng-template #file></ng-template>
      <ng-template #empty>
        <div class="flex items-center justify-center flex-col">
          <i
            class="pi pi-cloud-upload !border-2 !rounded-full !p-8 !text-4xl !text-muted-color"></i>
          <p class="mt-6 mb-0">Drag and drop files to here to upload.</p>
        </div>
      </ng-template>
    </p-fileupload>
  </div>

  <p-button
    type="submit"
    label="Ajouter le véhicule"
    [disabled]="form.invalid || !files || files.length === 0"></p-button>
</form>
