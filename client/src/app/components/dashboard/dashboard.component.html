<p-panel>
  <p-table [value]="vehicleData" [paginator]="true" [rows]="5" showGridlines>
    <ng-template #caption>
      <div class="flex items-center justify-between">
        <span class="text-xl font-bold">Gestion de véhicules</span>
        <p-button
          (onClick)="addVehicle()"
          pTooltip="Ajout d'un véhicule"
          icon="pi pi-plus" />
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th>ID du véhicule</th>
        <th>Marque</th>
        <th>Modèle</th>
        <th>Statut</th>
        <th>Prix</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-vehicle>
      <tr>
        <td>{{ vehicle.id }}</td>
        <td>{{ vehicle.brand }}</td>
        <td>{{ vehicle.model }}</td>
        <td>
          <p-tag
            [value]="vehicle.type"
            [severity]="getType(vehicle.type)"></p-tag>
        </td>
        <td>{{ vehicle.price }} €</td>
        <td>
          <p-button
            class="mr-2"
            severity="warn"
            pTooltip="Modifier"
            tooltipPosition="top"
            icon="pi pi-file-edit"
            (onClick)="editVehicle(vehicle)"></p-button>
          <p-button
            class="mr-2"
            severity="warn"
            pTooltip="Voir détails"
            tooltipPosition="top"
            icon="pi pi-info-circle"></p-button>
          <p-button
            severity="warn"
            pTooltip="Supprimer"
            tooltipPosition="top"
            icon="pi pi-times"
            (onClick)="deleteVehicle(vehicle)"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-panel>
