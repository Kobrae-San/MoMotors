services:
  database:
    image: postgres:17.2
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mmotor
    ports:
      - 5432:5432
    volumes:
      - ./config:/docker-entrypoint-initdb.d
      # - ./db-data/:/var/lib/postgresql/data/

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "4200:4200"
    volumes:
      - ./client:/app
      - /app/node_modules

  ms-file:
    build:
      context: microservices/transaction
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./microservices/transaction:/app
      - ./microservices/shared:/app/shared
    depends_on:
      - database

  ms-user:
    build:
      context: ./microservices/user
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - ./microservices/user:/app
      - ./microservices/shared:/app/shared
    depends_on:
      - database

  ms-vehicle:
    build:
      context: ./microservices/vehicle
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    volumes:
      - ./microservices/vehicle:/app
      - ./microservices/shared:/app/shared
    depends_on:
      - database
