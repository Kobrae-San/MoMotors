services:
  database:
    image: postgres:17.2
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    ports:
      - 5432:5432
    volumes:
      - ./config:/docker-entrypoint-initdb.d
      # - ./db-data/:/var/lib/postgresql/data/

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "4200:4200"
    volumes:
      - ./client:/app
      - node_modules:/app/node_modules

  ms-transaction:
    build:
      context: ./microservices/transaction
      dockerfile: Dockerfile
    environment:
      DB_NAME: ${POSTGRES_DB_NAME}
      DB_USER: ${POSTGRES_DB_USER}
      DB_PASSWORD: ${POSTGRES_DB_PASSWORD}
      DB_HOST: ${POSTGRES_DB_HOST}
      DB_PORT: ${POSTGRES_DB_PORT}
    ports:
      - "3001:3001"
    volumes:
      - ./microservices/transaction:/app
      - ./microservices/shared:/app/shared
    depends_on:
      - database

  ms-user:
    build:
      context: ./microservices/user
      dockerfile: Dockerfile
    environment:
      DB_NAME: ${POSTGRES_DB_NAME}
      DB_USER: ${POSTGRES_DB_USER}
      DB_PASSWORD: ${POSTGRES_DB_PASSWORD}
      DB_HOST: ${POSTGRES_DB_HOST}
      DB_PORT: ${POSTGRES_DB_PORT}
    ports:
      - "3002:3002"
    volumes:
      - ./microservices/user:/app
      - ./microservices/shared:/app/shared
    depends_on:
      - database

  ms-vehicle:
    build:
      context: ./microservices/vehicle
      dockerfile: Dockerfile
    environment:
      DB_NAME: ${POSTGRES_DB_NAME}
      DB_USER: ${POSTGRES_DB_USER}
      DB_PASSWORD: ${POSTGRES_DB_PASSWORD}
      DB_HOST: ${POSTGRES_DB_HOST}
      DB_PORT: ${POSTGRES_DB_PORT}
    ports:
      - "3003:3003"
    volumes:
      - ./microservices/vehicle:/app
      - ./microservices/shared:/app/shared
    depends_on:
      - database

volumes:
  node_modules:
