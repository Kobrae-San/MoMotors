services:
  database:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mmotor
    ports:
      - 5432:5432
    volumes:
      - ./config:/docker-entrypoint-initdb.d
      # - ./db-data/:/var/lib/postgresql/data/

  api:
    build:
      context: ./api
      dockerfile: Dockerfile